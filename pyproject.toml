[build-system]
requires = [
    "setuptools<81.0",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "excel2sbol"
version = "2.0.1"
description = "Excel-to-SBOL is an open source python library that converts Excel Templates to SBOL documents"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "BSD-3-Clause"
license-files = ["LICEN[CS]E*"]
keywords = ["SBOL", "Excel", "templates", "convert", "synthetic biology"]
authors = [
  { name="Jet Mante", email="jet.mante@colorado.edu" }
]
maintainers = [
  { name = "Carolus Vitalis", email = "carolus.vitalis@colorado.edu" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
    "openpyxl==3.0.10",
    "numpy==1.26.4",
    "pandas==2.2",
    "rdflib==6.2",
    "requests>=2.25",
    "sbol2==1.4",
    "sbol3==1.1",
    "tyto==1.4",
    "urllib3==1.26.5",
    "validators==0.18.2",
    "packaging==24.0"
]

[project.optional-dependencies]
test = [
  "pytest>=7,<8",
  "pytest-cov>=4,<5"
]
gui = [
  "pywebview>=5.0"
]

[project.urls]
"Homepage" = "https://github.com/SynBioDex/Excel-to-SBOL"
"Bug Tracker" = "https://github.com/SynBioDex/Excel-to-SBOL/issues"
